<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MANGAUD">
  <defs>
    <linearGradient id="mg-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16233D"/>
      <stop offset="55%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#0A1017"/>
    </linearGradient>
    <linearGradient id="mg-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5B841"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#mg-base)"/>

  <!-- vault concentric arcs -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#F5B841" stroke-opacity="0.16" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#F5B841" stroke-opacity="0.26" stroke-width="1.5"/>

  <!-- rupee glyph -->
  <g fill="none" stroke="url(#mg-accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 23 H41"/>
    <path d="M23 30 H41"/>
    <path d="M31 23 V31 C31 38 36 40 42 40"/>
  </g>

  <!-- ledger ticks -->
  <g fill="#F5B841" fill-opacity="0.5">
    <rect x="23" y="45" width="4" height="2" rx="1"/>
    <rect x="30" y="45" width="4" height="2" rx="1"/>
    <rect x="37" y="45" width="4" height="2" rx="1"/>
  </g>
</svg>
