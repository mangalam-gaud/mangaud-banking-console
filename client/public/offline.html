<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline &middot; MANGAUD</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #0e1726;
        --ink-2: #16233d;
        --gold: #f5b841;
        --paper: #faf7f2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(120% 100% at 20% 0%, var(--ink-2) 0%, var(--ink) 60%, #080d15 100%);
        color: var(--paper);
        font-family: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .wrap { max-width: 30rem; }
      img { width: 72px; height: 72px; margin-bottom: 1.5rem; }
      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 0.75rem;
      }
      p { color: #b9c2cf; line-height: 1.65; margin: 0 0 1.5rem; }
      button {
        appearance: none;
        border: 1px solid rgba(245, 184, 65, 0.4);
        background: linear-gradient(180deg, #f5b841, #d97706);
        color: #1a1204;
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.5rem;
        border-radius: 0.7rem;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(245, 184, 65, 0.6); }
      .note { margin-top: 2rem; font-size: 0.8rem; color: #7d8794; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/logo.svg" alt="" />
      <h1>You're offline</h1>
      <p>
        MANGAUD needs a connection to check balances and move money. We'll
        reconnect automatically as soon as you're back.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="note">Banking data is never cached on this device.</p>
    </div>
  </body>
</html>
